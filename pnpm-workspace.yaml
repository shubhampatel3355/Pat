allowBuilds:
  "@node-rs/argon2": true
  "@prisma/engines": true
  prisma: true
  embedded-postgres: true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  esbuild: true
  sharp: false
  unrs-resolver: false
overrides:
  # Security fixes the parents haven't picked up yet. Drop these when exceljs, @sentry/node and typescript-eslint move on.
  "exceljs>uuid": 11.1.1
  "@sentry/bundler-plugins>glob": 14.0.3
  "@typescript-eslint/typescript-estree>minimatch": 11.0.4
peerDependencyRules:
  allowedVersions:
    # Auth.js's optional email-link provider asks for nodemailer 8; the app doesn't use that provider.
    nodemailer: "10"
