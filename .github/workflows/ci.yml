name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec next build
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level=high

  mobile:
    name: Mobile app · typecheck · SDK versions · bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Includes the web's shared helpers in ../src/lib, so a change there that breaks the app fails here.
      - run: npm run typecheck
      - run: npx expo install --check
      # Bundles the app as Expo Go would load it.
      - run: npx expo export --platform android --output-dir dist-check

  e2e:
    name: Production image · end-to-end (Postgres · MinIO · Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
    env:
      # Test credentials for throwaway CI services only. The specs load their demo data as the schema owner.
      NODE_ENV: test
      DATABASE_URL: postgresql://pm_owner:ci-owner@localhost:5432/patmichaels_e2e
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      SEED_OWNER_PASSWORD: E2e-Owner-Password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the image Coolify builds
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t pat-michaels-os .
      - name: Database roles (docs/DEPLOY.md, step 4)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pm_owner LOGIN PASSWORD 'ci-owner';
          CREATE ROLE pm_app LOGIN PASSWORD 'ci-app';
          CREATE DATABASE patmichaels_e2e OWNER pm_owner;
          REVOKE ALL ON DATABASE patmichaels_e2e FROM PUBLIC;
          GRANT CONNECT, TEMPORARY ON DATABASE patmichaels_e2e TO pm_app;
          \c patmichaels_e2e
          ALTER SCHEMA public OWNER TO pm_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO pm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE pm_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO pm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE pm_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO pm_app;
          CREATE SCHEMA pgboss AUTHORIZATION pm_app;
          SQL
      - name: Storage (docs/DEPLOY.md, step 5)
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER=ci-root -e MINIO_ROOT_PASSWORD=ci-root-password \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data --console-address ":9001"
          for i in $(seq 1 30); do docker exec minio mc ready local && break; sleep 2; done
          docker exec -i minio sh -e <<'SH'
          mc alias set pm http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb pm/pat-michaels-os
          mc version enable pm/pat-michaels-os
          cat > /tmp/pm-app.json <<'JSON'
          { "Version": "2012-10-17", "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket"], "Resource": ["arn:aws:s3:::pat-michaels-os"] },
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"], "Resource": ["arn:aws:s3:::pat-michaels-os/*"] }
          ] }
          JSON
          mc admin policy create pm pm-app /tmp/pm-app.json
          mc admin user add pm pm-app ci-storage-secret
          mc admin policy attach pm pm-app --user pm-app
          SH
      - name: Start the container with production settings
        run: |
          docker run -d --name app --network host \
            -e APP_URL=http://localhost:3000 \
            -e DATABASE_URL=postgresql://pm_app:ci-app@localhost:5432/patmichaels_e2e \
            -e MIGRATION_DATABASE_URL=postgresql://pm_owner:ci-owner@localhost:5432/patmichaels_e2e \
            -e AUTH_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef \
            -e ENCRYPTION_KEY \
            -e S3_ENDPOINT=http://127.0.0.1:9000 \
            -e S3_BUCKET=pat-michaels-os \
            -e S3_ACCESS_KEY_ID=pm-app \
            -e S3_SECRET_ACCESS_KEY=ci-storage-secret \
            -e S3_FORCE_PATH_STYLE=true \
            -e SMTP_HOST=localhost -e SMTP_PORT=1025 -e SMTP_SECURE=false \
            -e COMPANY_BANK_NAME="CI Bank" -e COMPANY_BANK_ACCOUNT_NAME=CI -e COMPANY_BANK_ACCOUNT_NUMBER=0 -e COMPANY_BANK_IFSC=CI00000000 \
            -e SEED_OWNER_PASSWORD \
            pat-michaels-os
      - name: Wait for migrations, seed, job workers and the image's health check
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' app)
            echo "$status"
            if [ "$status" = "running healthy" ]; then
              docker logs app 2>&1 | grep -q "Seed complete"
              docker logs app 2>&1 | grep -q "job workers started"
              exit 0
            fi
            [ "${status%% *}" = "exited" ] && break
            sleep 5
          done
          docker logs app
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          # The invoice spec waits for its email (with the PDF attached) to reach Mailpit.
          MAILPIT_URL: http://localhost:8025
      - name: Container logs
        if: failure()
        run: |
          docker logs app 2>&1 | tail -200
          # Errors as annotations, so they show on the commit without opening the log.
          docker logs app 2>&1 | grep -E '"level":(50|60)' | cut -c1-600 | sort -u | tail -15 | while read -r line; do echo "::error title=Container log::$line"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then echo "COOLIFY_WEBHOOK not set — skipping (Coolify may auto-deploy via its GitHub App)"; exit 0; fi
          curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
