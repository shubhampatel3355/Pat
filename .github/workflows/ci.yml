name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec next build
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level=high

  e2e:
    name: End-to-end (Playwright · Postgres · MinIO · Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: patmichaels_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
    env:
      # Test credentials for throwaway CI services only.
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patmichaels_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      AUTH_OTP_FOR_ADMINS: "false"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: pat-michaels-os-e2e
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin-ci
      S3_FORCE_PATH_STYLE: "true"
      MAIL_DRIVER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SEED_OWNER_PASSWORD: E2e-Owner-Password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Service containers can't pass MinIO its "server" command, so it runs as a step.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin-ci \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && exit 0; sleep 2; done
          docker logs minio; exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec next build
      # The specs run through `next start`, which sees all of node_modules. This starts what the Docker image runs: the
      # standalone output with the least-privileged database role from docs/DEPLOY.md, background job workers included.
      - name: Production start-up (standalone, restricted database role)
        env:
          PGPASSWORD: postgres
          HOSTNAME: 0.0.0.0
          PORT: "3199"
          APP_URL: http://localhost:3199
          DATABASE_URL: postgresql://pm_app:app@localhost:5432/patmichaels_startup
          MIGRATION_DATABASE_URL: postgresql://pm_owner:owner@localhost:5432/patmichaels_startup
          S3_PUBLIC_ENDPOINT: http://localhost:9000
          COMPANY_BANK_NAME: CI Bank
          COMPANY_BANK_ACCOUNT_NAME: CI
          COMPANY_BANK_ACCOUNT_NUMBER: "0"
          COMPANY_BANK_IFSC: CI00000000
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pm_owner LOGIN PASSWORD 'owner';
          CREATE ROLE pm_app LOGIN PASSWORD 'app';
          CREATE DATABASE patmichaels_startup OWNER pm_owner;
          REVOKE ALL ON DATABASE patmichaels_startup FROM PUBLIC;
          GRANT CONNECT, TEMPORARY ON DATABASE patmichaels_startup TO pm_app;
          \c patmichaels_startup
          ALTER SCHEMA public OWNER TO pm_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO pm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE pm_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO pm_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE pm_owner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO pm_app;
          CREATE SCHEMA pgboss AUTHORIZATION pm_app;
          SQL
          pnpm exec prisma migrate deploy
          node .next/standalone/server.js > "$RUNNER_TEMP/standalone.log" 2>&1 &
          server=$!
          for i in $(seq 1 30); do
            if grep -q "job workers started" "$RUNNER_TEMP/standalone.log" && curl -fsS http://localhost:3199/api/health; then
              kill "$server"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/standalone.log"
          exit 1
      - run: pnpm test:e2e
        env:
          # The invoice spec waits for its email (with the PDF attached) to reach Mailpit.
          MAILPIT_URL: http://localhost:8025
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Call Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then echo "COOLIFY_WEBHOOK not set — skipping (Coolify may auto-deploy via its GitHub App)"; exit 0; fi
          curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"
